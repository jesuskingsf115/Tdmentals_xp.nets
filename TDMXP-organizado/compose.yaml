
services:
  postgres:
    image: postgres:17
    container_name: tdmxp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tdmxp_db}
      POSTGRES_USER: ${DB_USER:-tdmxp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tdmxp_user} -d ${DB_NAME:-tdmxp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tdmxp-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tdmxp-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tdmxp_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-tdmxp_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tdmxp-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tdmxp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [tdmxp-network]

volumes:
  postgres_data:

networks:
  tdmxp-network:
    driver: bridge
